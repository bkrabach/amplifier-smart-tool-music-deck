[project]
name = "music-deck"
version = "0.1.0"
description = "A Spotify smart tool with bounded model-backed do music operations, reviewable plan/apply, and deterministic catalog, playlist, library, device, and playback commands. Deterministic verbs run with no provider; Spotify operations require caller credentials, while check needs neither credentials nor network."
readme = "README.md"
# >= 3.12 because the amplifier-agent engine library model-backed verbs run on requires it,
# and a floor that admits a caller the tool cannot serve is not a floor. Every
# deterministic verb would run on 3.11; naming 3.11 anyway would let `uv sync`
# succeed on a host where model-backed verbs can never be installed at all --
# cli.v1 Core 3's refusal is meant for a missing credential, not for an
# interpreter nobody can change.
requires-python = ">=3.12"
license = { text = "MIT" }

# Base dependencies carry NO provider SDK. cli.v1 Core 2: "Deterministic verbs
# need no model provider. Every verb except `plan` and `do` runs with no provider
# configured and no provider SDK installed." pyyaml is here only because
# SMART_TOOL.md's frontmatter is YAML and `music_deck.manifest()` parses the
# copy built into the package (cli.v1 Core 7).
dependencies = [
    "httpx>=0.28",
    "ifaddr>=0.2.0",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "zeroconf>=0.151.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Provider stacks are extras, never base dependencies. cli.v1 Core 2 promises
# every verb except `plan` and `do` runs "with no provider configured and no provider SDK
# installed", and a base dependency would quietly break that promise for the
# forty verbs that never touch a model. `music_deck.intelligence.preflight`
# names the extra a caller is missing, so the refusal (exit 3) and the fix here
# stay in step.
anthropic = ["anthropic"]
openai = ["openai"]
gemini = ["google-genai"]
azure-openai = ["openai"]

[project.scripts]
music-deck = "music_deck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Private runtime evidence must not ship, even when a build ignores VCS rules.
exclude = [
    "/.private",
    "/scratch",
    "/evidence/live-round-trip-*.md",
    "/.env",
    "/.env.*",
]

[tool.hatch.build.targets.wheel]
# SMART_TOOL.md lives inside the package directory so it ships with the tool
# and `music_deck.manifest()` can read it via importlib.resources from an
# installed environment -- never from a checkout-relative path.
packages = ["src/music_deck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` marks the one test that needs a real provider and a real account
# (`tests/test_do_live.py`). It skips -- loudly, with the reason -- wherever
# those are absent, which is everywhere except a deliberate live run. Registered
# here because a marker cannot be registered from the module that uses it, and
# an unregistered one is a warning on every single run.
markers = [
    "live: needs a real model provider, the engine, and a signed-in Spotify account",
]
