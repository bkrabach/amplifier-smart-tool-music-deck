[project]
name = "music-deck"
version = "0.1.0"
description = "A smart tool for curating and controlling music on Spotify from any agent: a brief becomes a readable plan, and the plan is applied deterministically. Deterministic verbs run with no provider, no credentials, and (for `check`) no network."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Base dependencies carry NO provider SDK. cli.v1 Core 2: "Deterministic verbs
# need no model provider. Every verb except `plan` runs with no provider
# configured and no provider SDK installed." pyyaml is here only because
# SMART_TOOL.md's frontmatter is YAML and `music_deck.manifest()` parses the
# copy built into the package (cli.v1 Core 7).
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Provider stacks are extras, never base dependencies. cli.v1 Core 2 promises
# every verb except `plan` runs "with no provider configured and no provider SDK
# installed", and a base dependency would quietly break that promise for the
# forty verbs that never touch a model. `music_deck.intelligence.preflight`
# names the extra a caller is missing, so the refusal (exit 3) and the fix here
# stay in step.
anthropic = ["anthropic"]
openai = ["openai"]
gemini = ["google-genai"]
azure-openai = ["openai"]

[project.scripts]
music-deck = "music_deck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# SMART_TOOL.md lives inside the package directory so it ships with the tool
# and `music_deck.manifest()` can read it via importlib.resources from an
# installed environment -- never from a checkout-relative path.
packages = ["src/music_deck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
